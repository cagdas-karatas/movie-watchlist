name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check src/ tests/ ui/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit --cov=src --cov-report=xml --cov-fail-under=70
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/integration -v

  docker-build:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t movie-watchlist:${{ github.sha }} .
      - name: Save image as tar
        run: docker save movie-watchlist:${{ github.sha }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  newman-smoke:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - run: docker load -i image.tar
      - name: Start container
        run: |
          docker run -d -p 8000:8000 --name movie-app movie-watchlist:${{ github.sha }}
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo "App is up"; break
            fi
            sleep 2
          done
      - name: Install newman
        run: npm install -g newman
      - name: Run newman
        run: newman run postman/collection.json --env-var "base_url=http://localhost:8000"
      - name: Cleanup
        if: always()
        run: docker rm -f movie-app

  k8s-validate:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate manifests
        run: |
          for f in k8s/*.yaml; do
            kubectl apply --dry-run=client --validate=false -f "$f"
          done
